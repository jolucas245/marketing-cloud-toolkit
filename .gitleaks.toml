# gitleaks: the default rules, plus known false positives (security review, 2026-10-28).
[extend]
useDefault = true

[[allowlists]]
description = "Test data: an event definition key, not a secret"
paths = ['''src/utils/__tests__/journeysCloudPages\.test\.js''']
regexes = ['''DEAudience-123''']
condition = "AND"
regexTarget = "match"

[[allowlists]]
description = "Restore by myself: the example cURL command uses a placeholder, not a token"
paths = ['''src/utils/selfRestore\.js''']
regexes = ['''YOUR_ACCESS_TOKEN''']
condition = "AND"
regexTarget = "line"

[[allowlists]]
description = "Test data: a SQL join condition on SubscriberKey, not a secret"
paths = ['''src/utils/__tests__/deSql\.test\.js''']
regexes = ['''SubscriberKey = t2\.SubscriberKey''']
condition = "AND"
regexTarget = "line"
